version: '3.8'

services:
  jarvis:
    build: .
    container_name: jarvis
    ports:
      - "7777:7777"
      - "7778:7778"
    volumes:
      - ~/.jarvis:/root/.jarvis
      - ./workspace:/app/workspace
    devices:
      - /dev/snd:/dev/snd
    environment:
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    stdin_open: true
    tty: true

  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

volumes:
  ollama_data:
  jarvis_data:
