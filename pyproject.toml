[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai-agent-cli"
version = "2.1.1"
description = "Personal AI Assistant and Autonomous System Controller"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohit Patel" }]
dependencies = [
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "psutil>=5.9.0; sys_platform != 'android'",
    "pyperclip>=1.8.2",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
all = [
    "openai>=1.0.0",
    "google-generativeai>=0.8.0",
    "google-auth-oauthlib>=1.0.0",
    "anthropic>=0.30.0",
    "chromadb>=1.5.0",
    "playwright>=1.40.0",
    "openai-whisper>=20231117",
    "edge-tts>=6.1.0",
    "pyttsx3>=2.90",
    "cryptography>=41.0.0",
    "pyjwt>=2.8.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
]

[project.scripts]
jarvis = "main:main"
jarvis-cli = "main:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "venv*", "scratch*"]

[tool.setuptools]
py-modules = ["banner", "cli", "daemon", "jarvis_input", "main", "wizard"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.html", "*.css", "*.js", "*.png", "*.ico", "*.txt"]
